<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BGT-meldingen IJsselstein</title>
<link rel="stylesheet" href="lib/leaflet/leaflet.css">
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --fg: #1d2330; --muted: #5d6677; --line: #dde1e8;
    --accent: #0b5cad; --accent-fg: #ffffff; --soft: #eef2f8; --focus: #0b5cad;
    --ok: #1b7a4b; --bad: #b3261e; --warn: #8a6100;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11151c; --panel: #1a202b; --fg: #e8ebf1; --muted: #9aa4b5; --line: #2e3646;
      --accent: #6aa9ff; --accent-fg: #0b1220; --soft: #232b39; --focus: #6aa9ff;
      --ok: #5fd18f; --bad: #ff8a80; --warn: #f0c35a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); }
  .app { display: grid; grid-template-columns: 420px 1fr; height: 100vh; }
  aside { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); }
  .kaartvak { position: relative; min-height: 0; }
  #kaart { position: absolute; inset: 0; background: #c9ced6; }
  header.kop { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  header.kop h1 { margin: 0 0 2px; font-size: 17px; line-height: 1.25; }
  header.kop p { margin: 0; color: var(--muted); font-size: 12.5px; }
  .waarschuwing { margin: 10px 16px 0; padding: 8px 10px; background: var(--soft); border-radius: var(--radius); font-size: 12.5px; color: var(--muted); }
  nav.tabs { display: flex; gap: 4px; padding: 10px 16px 0; border-bottom: 1px solid var(--line); }
  nav.tabs button { flex: 1; padding: 8px 6px; border: 0; border-bottom: 3px solid transparent; background: none; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; }
  nav.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
  .panelen { flex: 1; min-height: 0; overflow: auto; }
  .paneel { padding: 14px 16px 18px; }
  .paneel[hidden] { display: none; }
  h2 { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
  h2:first-child { margin-top: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .knop { padding: 7px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); cursor: pointer; }
  .knop:hover { background: var(--soft); }
  .knop.primair { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
  .knop.primair:hover { filter: brightness(1.08); background: var(--accent); }
  .knop:disabled { opacity: .5; cursor: not-allowed; }
  .rij { display: grid; grid-template-columns: 18px 14px 1fr auto; gap: 8px; align-items: center; padding: 5px 0; cursor: pointer; }
  .rij.nul { opacity: .6; }
  .rij.zonder { grid-template-columns: 18px 1fr auto; }
  .rij.sub { margin-left: 26px; padding: 3px 0; }
  .rij input:disabled ~ * { opacity: .5; }
  .popup dl.kenmerken { grid-template-columns: 9.5em 1fr; font-size: 12.5px; margin: 6px 0 0; }
  .swatch { width: 14px; height: 14px; border-radius: 3px; border: 2px solid; }
  .aantal { font-variant-numeric: tabular-nums; color: var(--muted); }
  .ernstrij { display: flex; gap: 14px; flex-wrap: wrap; }
  .ernstrij label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  input[type="search"], select, textarea, input[type="text"] { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
  textarea { min-height: 70px; resize: vertical; }
  .voortgang { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; margin-top: 6px; }
  .voortgang > span { display: block; height: 100%; background: var(--ok); width: 0; }
  .klein { font-size: 12.5px; color: var(--muted); }
  ul.lijst { list-style: none; margin: 0; padding: 0; }
  ul.lijst li { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: center; padding: 8px 6px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 6px; }
  ul.lijst li:hover { background: var(--soft); }
  ul.lijst li.actief { background: var(--soft); outline: 2px solid var(--accent); outline-offset: -2px; }
  ul.lijst .titel { font-weight: 600; }
  ul.lijst .sub { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; border: 1px solid var(--line); white-space: nowrap; }
  .badge.terecht { color: var(--ok); border-color: var(--ok); }
  .badge.onterecht { color: var(--bad); border-color: var(--bad); }
  .badge.onzeker { color: var(--warn); border-color: var(--warn); }
  .badge.hoog { color: var(--bad); border-color: var(--bad); }
  dl.kenmerken { display: grid; grid-template-columns: 12.5em 1fr; gap: 4px 10px; margin: 10px 0; }
  dl.kenmerken dt { color: var(--muted); overflow-wrap: anywhere; }
  dl.kenmerken dd { margin: 0; overflow-wrap: anywhere; }
  .statusknoppen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0; }
  .statusknoppen button { padding: 8px 4px; border: 2px solid var(--line); border-radius: var(--radius); background: var(--panel); cursor: pointer; font-weight: 600; }
  .statusknoppen button[aria-pressed="true"] { background: var(--soft); }
  .statusknoppen button[data-s="terecht"][aria-pressed="true"] { border-color: var(--ok); color: var(--ok); }
  .statusknoppen button[data-s="onterecht"][aria-pressed="true"] { border-color: var(--bad); color: var(--bad); }
  .statusknoppen button[data-s="onzeker"][aria-pressed="true"] { border-color: var(--warn); color: var(--warn); }
  .nav { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  label.veld { display: block; margin-top: 10px; font-weight: 600; font-size: 12.5px; }
  label.veld > * { font-weight: 400; margin-top: 4px; }
  footer.voet { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #bericht { flex-basis: 100%; min-height: 1.3em; font-size: 12.5px; color: var(--muted); }
  #tegelmelding { position: absolute; z-index: 1000; left: 50%; transform: translateX(-50%); bottom: 22px; max-width: min(520px, 90%); padding: 8px 12px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--warn); color: var(--fg); font-size: 12.5px; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #tegelmelding[hidden] { display: none; }
  .leaflet-container { font: inherit; }
  details.over { margin-top: 18px; }
  details.over summary { cursor: pointer; font-weight: 600; }
  @media (max-width: 820px) {
    .app { display: flex; flex-direction: column; height: auto; }
    .kaartvak { order: -1; height: 55vh; flex: none; }
    aside { border-right: 0; border-top: 1px solid var(--line); }
    .panelen { overflow: visible; }
    dl.kenmerken { grid-template-columns: 10.5em 1fr; }
  }
</style>
</head>
<body>
<noscript>Voor dit dashboard is JavaScript nodig.</noscript>
<div class="app">
  <aside aria-label="Meldingen en filters">
    <header class="kop">
      <h1>BGT-meldingen, Gemeente IJsselstein</h1>
      <p id="bronregel">Laden...</p>
    </header>
    <div class="waarschuwing" id="letop"></div>
    <nav class="tabs" role="tablist" aria-label="Weergave">
      <button role="tab" id="tab-filters" aria-controls="paneel-filters" aria-selected="true">Filters</button>
      <button role="tab" id="tab-lijst" aria-controls="paneel-lijst" aria-selected="false">Lijst <span id="lijsttelling"></span></button>
      <button role="tab" id="tab-melding" aria-controls="paneel-melding" aria-selected="false">Melding</button>
    </nav>
    <div class="panelen">
      <section class="paneel" id="paneel-filters" role="tabpanel" aria-labelledby="tab-filters"></section>
      <section class="paneel" id="paneel-lijst" role="tabpanel" aria-labelledby="tab-lijst" hidden></section>
      <section class="paneel" id="paneel-melding" role="tabpanel" aria-labelledby="tab-melding" hidden></section>
    </div>
    <footer class="voet">
      <button class="knop" id="exp-json" type="button">Beoordelingen (JSON)</button>
      <button class="knop" id="exp-csv" type="button">Beoordelingen (CSV)</button>
      <button class="knop" id="imp" type="button">Importeren</button>
      <input id="imp-bestand" type="file" accept="application/json,.json" hidden>
      <div id="bericht" role="status" aria-live="polite"></div>
    </footer>
  </aside>
  <main class="kaartvak">
    <div id="kaart" role="application" aria-label="Kaart met meldingen"></div>
    <div id="tegelmelding" hidden>De achtergrondkaart laadt niet. Kies rechtsboven een andere achtergrond of controleer de tegel-URL's bovenin het script in index.html.</div>
  </main>
</div>

<script src="lib/leaflet/leaflet.js"></script>
<script>
(function () {
  'use strict';

  // ---------- Instellingen ----------
  // meldingen_alle.geojson + meldingen_groen_verschil_2024_2026.geojson (voeg_samen.py --vervang-typen)
  const DATA_URL = 'meldingen_alle_v3.geojson';
  const VLAKKEN_URL = 'bgt_vlakken.geojson';
  // Kleur per soort groen in de BGT-vlakkenlaag (plus_fysiek_voorkomen).
  const KLASSE_KLEUR = {
    'bosplantsoen': '#276419', 'heesters': '#4dac26', 'gras- en kruidachtigen': '#b8e186',
    'planten': '#de77ae', 'bodembedekkers': '#8e6bbf', 'struikrozen': '#d6604d',
    'plus onbekend': '#bdbdbd', 'grasland agrarisch': '#dfc27d', 'grasland overig': '#a6611a',
  };
  const STORE_KEY = 'bgt-beoordelingen-v1';
  const NAAM_KEY = 'bgt-beoordelaar-v1';
  // Tegel-URL's van PDOK (EPSG:3857). Werkt de achtergrond niet? Vergelijk met de
  // WMTS-URL die in QGIS werkt en pas deze constanten aan.
  const PDOK_LUCHT = 'https://service.pdok.nl/hwh/luchtfotorgb/wmts/v1_0/{laag}/EPSG:3857/{z}/{x}/{y}.jpeg';
  // Infrarood (CIR): vegetatie kleurt rood, verharding grijs/blauw.
  const PDOK_INFRAROOD = 'https://service.pdok.nl/hwh/luchtfotocir/wmts/v1_0/{laag}/EPSG:3857/{z}/{x}/{y}.jpeg';
  const PDOK_BGT = 'https://service.pdok.nl/kadaster/bgt/wmts/v1_0/standaardvisualisatie/EPSG:3857/{z}/{x}/{y}.png';
  const LUCHT_ATTR = 'Luchtfoto: Samenwerkingsverband Beeldmateriaal, via PDOK, CC BY';
  // Kleurenblind-vriendelijk palet (Okabe-Ito en aanvullingen).
  const PALET = ['#0072B2', '#E69F00', '#009E73', '#CC79A7', '#D55E00', '#56B4E9', '#F0E442', '#999999', '#882255', '#44AA99',
    // Aanvulling uit Paul Tol "muted" (kleurenblind-veilig): indigo en olijf.
    '#332288', '#999933',
    // Paul Tol "light" roze: goed zichtbaar op de luchtfoto, ook bij kleurenblindheid onderscheidbaar.
    '#FFAABB',
    // Paul Tol "bright" rood: zichtbaar op de luchtfoto, bij kleurenblindheid >= 10 dE van de rest.
    '#EE6677'];
  const ERNST = { hoog: 0, midden: 1, laag: 2, info: 3 };
  const STATUS_TEKST = { onbeoordeeld: 'Nog niet beoordeeld', terecht: 'Terecht signaal', onterecht: 'Onterecht signaal', onzeker: 'Onzeker' };
  const STATUS_GLYPH = { terecht: '✓', onterecht: '✗', onzeker: '?' };

  // ---------- Hulpfuncties ----------
  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === false || v == null) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) {
      if (kid == null) continue;
      n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return n;
  };
  const $ = (id) => document.getElementById(id);
  const fmtM2 = (n) => n == null ? '-' : n.toLocaleString('nl-NL', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' m²';

  // Opslag in de browser. Kan leeg zijn of een fout geven (privevenster); dan blijft het in het geheugen.
  const geheugen = {};
  const opslag = {
    lees(k) { try { const v = window.localStorage.getItem(k); return v == null ? geheugen[k] ?? null : v; } catch (e) { return geheugen[k] ?? null; } },
    schrijf(k, v) { geheugen[k] = v; try { window.localStorage.setItem(k, v); } catch (e) { /* alleen geheugen */ } },
  };
  let beoordelingen = {};
  try { beoordelingen = JSON.parse(opslag.lees(STORE_KEY) || '{}') || {}; } catch (e) { beoordelingen = {}; }
  const bewaar = () => opslag.schrijf(STORE_KEY, JSON.stringify(beoordelingen));
  const statusVan = (id) => (beoordelingen[id] && beoordelingen[id].status) || 'onbeoordeeld';
  const bericht = (t) => { $('bericht').textContent = t; };

  // ---------- Toestand ----------
  let data = null, meta = {}, typeInfo = {}, typeKleur = {};
  let alle = [];          // alle features, gesorteerd
  const perId = new Map();
  const state = { types: new Set(), ernsten: new Set(), status: 'alle', zoek: '' };
  let geselecteerd = null;
  let geoLaag = null, hl = null;
  const lagen = new Map();
  // Kaartlagen: alle BGT-vlakken (onder) en de meldingen (boven)
  let vlakkenData = null, vlakkenMeta = {}, vlakkenLaag = null;
  const lagenState = { vlakken: true, meldingen: true, klassen: new Set() };

  // ---------- Kaart ----------
  const map = L.map('kaart', { zoomSnap: 0.25, zoomDelta: 0.5, maxZoom: 21 }).setView([52.0316, 5.0455], 15);
  // BGT-vlakken liggen onder de meldingen (overlayPane heeft zIndex 400)
  map.createPane('vlakkenPane').style.zIndex = 380;
  const tegels = (url, opties) => L.tileLayer(url, Object.assign({ maxNativeZoom: 19, maxZoom: 21 }, opties));
  const achtergronden = {
    'Luchtfoto 2026 (PDOK)': tegels(PDOK_LUCHT.replace('{laag}', '2026_orthoHR'), { attribution: LUCHT_ATTR }),
    'Luchtfoto 2025 (PDOK)': tegels(PDOK_LUCHT.replace('{laag}', '2025_orthoHR'),{ attribution: LUCHT_ATTR }),
    // Laagnamen uit de WMTS GetCapabilities van luchtfotorgb ("Luchtfoto 20xx Ortho 8cm RGB")
    'Luchtfoto 2024 (PDOK, 8 cm)': tegels(PDOK_LUCHT.replace('{laag}', '2024_orthoHR'), { attribution: LUCHT_ATTR }),
    'Luchtfoto 2023 (PDOK, 8 cm)': tegels(PDOK_LUCHT.replace('{laag}', '2023_orthoHR'), { attribution: LUCHT_ATTR }),
    'Luchtfoto 2022 (PDOK, 8 cm)': tegels(PDOK_LUCHT.replace('{laag}', '2022_orthoHR'), { attribution: LUCHT_ATTR }),
    'Infrarood 2026 (PDOK)': tegels(PDOK_INFRAROOD.replace('{laag}', '2026_orthoHRIR'), { attribution: LUCHT_ATTR }),
    'Infrarood actueel (PDOK)': tegels(PDOK_INFRAROOD.replace('{laag}', 'Actueel_orthoHRIR'), { attribution: LUCHT_ATTR }),
    // PDOK BGT geeft bij zoom <= 16 lege (doorzichtige) tegels; vanaf 17 tekent hij. Daarom altijd z17+ ophalen en verkleinen.
    'BGT-kaart (PDOK)': tegels(PDOK_BGT, { attribution: 'BGT: Kadaster, via PDOK', minNativeZoom: 17, maxNativeZoom: 21 }),
    'OpenStreetMap': tegels('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap-bijdragers' }),
  };
  let actieveAchtergrond = achtergronden['Luchtfoto 2026 (PDOK)'].addTo(map);
  L.control.layers(achtergronden, null, { collapsed: true }).addTo(map);
  L.control.scale({ metric: true, imperial: false }).addTo(map);

  // Melding als de achtergrond niet laadt
  let geladen = 0, mislukt = 0;
  Object.values(achtergronden).forEach((laag) => {
    laag.on('tileload', () => { if (laag === actieveAchtergrond) { geladen++; $('tegelmelding').hidden = true; } });
    laag.on('tileerror', () => { if (laag === actieveAchtergrond && ++mislukt >= 4 && geladen === 0) $('tegelmelding').hidden = false; });
  });
  map.on('baselayerchange', (e) => { actieveAchtergrond = e.layer; geladen = 0; mislukt = 0; $('tegelmelding').hidden = true; });

  // ---------- Filters ----------
  const zichtbaar = (f, negeerStatus) => {
    const p = f.properties;
    if (!state.types.has(p.type) || !state.ernsten.has(p.ernst)) return false;
    if (!negeerStatus && state.status !== 'alle' && statusVan(p.id) !== state.status) return false;
    if (state.zoek) {
      const hooi = [p.id, p.lokaal_id, p.toelichting, (typeInfo[p.type] || {}).label].join(' ').toLowerCase();
      if (!hooi.includes(state.zoek)) return false;
    }
    return true;
  };
  const gefilterd = () => alle.filter((f) => zichtbaar(f));

  // ---------- Stijl ----------
  const stijl = (f) => {
    const p = f.properties, kleur = typeKleur[p.type] || '#888';
    const klaar = statusVan(p.id) !== 'onbeoordeeld';
    return {
      color: kleur, weight: p.ernst === 'hoog' ? 3 : 2, opacity: 1,
      fillColor: kleur, fillOpacity: klaar ? 0.1 : 0.38,
      dashArray: (klaar || p.type === 'open_ruimte') ? '5 4' : null,
    };
  };

  // ---------- Tekenen ----------
  function tekenKaart(feats) {
    if (geoLaag) map.removeLayer(geoLaag);
    lagen.clear();
    geoLaag = L.geoJSON({ type: 'FeatureCollection', features: feats }, {
      style: stijl,
      onEachFeature: (f, laag) => {
        lagen.set(f.properties.id, laag);
        laag.on('click', (e) => { L.DomEvent.stopPropagation(e); kies(f.properties.id, { zoom: false }); });
        laag.bindTooltip(`${f.properties.id} · ${(typeInfo[f.properties.type] || {}).label || f.properties.type}`, { sticky: true });
      },
    });
    if (lagenState.meldingen) geoLaag.addTo(map);
    markeerSelectie();
  }

  const klasseKleur = (k) => KLASSE_KLEUR[k] || '#7f7f7f';
  const hoofdletter = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);

  function popupInhoud(p) {
    return el('div', { class: 'popup' },
      el('strong', { text: hoofdletter(p.klasse) }),
      el('dl', { class: 'kenmerken' },
        el('dt', { text: 'lokaal_id' }), el('dd', { text: p.lokaal_id || '-' }),
        el('dt', { text: 'fysiek_voorkomen' }), el('dd', { text: p.fysiek_voorkomen || '-' }),
        el('dt', { text: 'Bronhouder' }), el('dd', { text: p.bronhouder || '-' }),
        el('dt', { text: 'Registratiejaar' }), el('dd', { text: p.registratiejaar != null ? String(p.registratiejaar) : '-' }),
        el('dt', { text: 'Oppervlakte' }), el('dd', { text: fmtM2(p.oppervlakte_m2) })));
  }

  // Alle BGT-vlakken van het testgebied, gekleurd per soort groen
  function tekenVlakken() {
    if (vlakkenLaag) { map.removeLayer(vlakkenLaag); vlakkenLaag = null; }
    if (!vlakkenData || !lagenState.vlakken) return;
    const feats = vlakkenData.features.filter((f) => lagenState.klassen.has(f.properties.klasse));
    vlakkenLaag = L.geoJSON({ type: 'FeatureCollection', features: feats }, {
      pane: 'vlakkenPane',
      style: (f) => { const k = klasseKleur(f.properties.klasse); return { color: k, weight: 1.5, opacity: 1, fillColor: k, fillOpacity: 0.45 }; },
      onEachFeature: (f, laag) => {
        laag.bindTooltip(`${hoofdletter(f.properties.klasse)} · ${fmtM2(f.properties.oppervlakte_m2)}`, { sticky: true });
        laag.bindPopup(() => popupInhoud(f.properties), { maxWidth: 320 });
      },
    }).addTo(map);
  }

  function markeerSelectie() {
    if (hl) { map.removeLayer(hl); hl = null; }
    const f = geselecteerd && perId.get(geselecteerd);
    if (!f || !lagen.has(geselecteerd) || !lagenState.meldingen) return;
    hl = L.layerGroup([
      L.geoJSON(f, { interactive: false, style: { color: '#ffffff', weight: 7, fill: false, opacity: 0.95 } }),
      L.geoJSON(f, { interactive: false, style: { color: '#000000', weight: 3, fill: false, opacity: 1 } }),
    ]).addTo(map);
  }

  function zoomNaarZichtbaar() {
    if (geoLaag && geoLaag.getLayers().length) map.fitBounds(geoLaag.getBounds(), { padding: [30, 30] });
  }

  function tekenLijst(feats) {
    $('lijsttelling').textContent = `(${feats.length})`;
    const paneel = $('paneel-lijst');
    paneel.replaceChildren();
    const MAX = 1000;
    paneel.append(el('p', { class: 'klein', text: `${feats.length} van ${alle.length} meldingen zichtbaar.` }));
    if (!feats.length) { paneel.append(el('p', { text: 'Geen meldingen voor deze filters.' })); return; }
    const ul = el('ul', { class: 'lijst' });
    feats.slice(0, MAX).forEach((f) => {
      const p = f.properties, st = statusVan(p.id);
      const li = el('li', { tabindex: 0, 'data-id': p.id, class: p.id === geselecteerd ? 'actief' : '' },
        el('span', { class: 'swatch', style: `border-color:${typeKleur[p.type]};background:${typeKleur[p.type]}66` }),
        el('div', {},
          el('div', { class: 'titel', text: `${p.id} · ${(typeInfo[p.type] || {}).label || p.type}` }),
          el('div', { class: 'sub', text: [p.lokaal_id, p.oppervlakte_m2 != null ? fmtM2(p.oppervlakte_m2) : null].filter(Boolean).join(' · ') || p.toelichting })),
        st === 'onbeoordeeld' ? el('span') : el('span', { class: 'badge ' + st, text: STATUS_GLYPH[st] + ' ' + STATUS_TEKST[st] }));
      const open = () => kies(p.id, { zoom: true });
      li.addEventListener('click', open);
      li.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
      ul.append(li);
    });
    paneel.append(ul);
    if (feats.length > MAX) paneel.append(el('p', { class: 'klein', text: `Eerste ${MAX} getoond. Verfijn de filters om de rest te zien.` }));
  }

  function tekenFilters(feats) {
    const paneel = $('paneel-filters');
    const actief = document.activeElement && document.activeElement.id;
    paneel.replaceChildren();
    const totaal = meta.aantal_per_type || {};
    const aantalType = (t) => totaal[t] != null ? totaal[t] : alle.filter((f) => f.properties.type === t).length;

    if (vlakkenData) {
      paneel.append(el('h2', { text: 'Kaartlagen' }));
      const aanVl = el('input', { type: 'checkbox', id: 'l-vlakken', checked: lagenState.vlakken });
      aanVl.addEventListener('change', () => { lagenState.vlakken = aanVl.checked; tekenVlakken(); tekenFilters(gefilterd()); });
      paneel.append(el('label', { class: 'rij zonder', title: 'Alle BGT-vlakken van het testgebied, per soort groen (plus_fysiek_voorkomen)' },
        aanVl, el('span', { text: 'BGT-vlakken, per soort groen' }), el('span', { class: 'aantal', text: String(vlakkenData.features.length) })));
      const per = vlakkenMeta.aantal_per_klasse || {};
      (vlakkenMeta.klassen || []).forEach((k) => {
        const kleur = klasseKleur(k);
        const cb = el('input', { type: 'checkbox', id: 'l-k-' + k.replace(/[^a-z0-9]+/gi, '-'), checked: lagenState.klassen.has(k), disabled: !lagenState.vlakken });
        cb.addEventListener('change', () => { cb.checked ? lagenState.klassen.add(k) : lagenState.klassen.delete(k); tekenVlakken(); });
        paneel.append(el('label', { class: 'rij sub' }, cb,
          el('span', { class: 'swatch', style: `border-color:${kleur};background:${kleur}99` }),
          el('span', { text: hoofdletter(k) }),
          el('span', { class: 'aantal', text: per[k] != null ? String(per[k]) : '' })));
      });
      const aanM = el('input', { type: 'checkbox', id: 'l-meldingen', checked: lagenState.meldingen });
      aanM.addEventListener('change', () => { lagenState.meldingen = aanM.checked; herteken(); });
      paneel.append(el('label', { class: 'rij zonder' }, aanM, el('span', { text: 'Meldingen' }), el('span', { class: 'aantal', text: String(alle.length) })));
    }

    paneel.append(el('h2', { text: 'Soort melding' }));
    Object.keys(typeInfo).forEach((t) => {
      const n = aantalType(t), info = typeInfo[t];
      const cb = el('input', { type: 'checkbox', id: 'f-t-' + t, checked: state.types.has(t) });
      cb.addEventListener('change', () => { cb.checked ? state.types.add(t) : state.types.delete(t); herteken(); });
      paneel.append(el('label', { class: 'rij' + (n === 0 ? ' nul' : ''), title: info.uitleg || '' },
        cb,
        el('span', { class: 'swatch', style: `border-color:${typeKleur[t]};background:${typeKleur[t]}66` }),
        el('span', { text: info.label }),
        el('span', { class: 'aantal', text: String(n) })));
    });

    paneel.append(el('h2', { text: 'Ernst' }));
    const rij = el('div', { class: 'ernstrij' });
    ['hoog', 'midden', 'laag', 'info'].filter((e) => alle.some((f) => f.properties.ernst === e)).forEach((e) => {
      const cb = el('input', { type: 'checkbox', id: 'f-e-' + e, checked: state.ernsten.has(e) });
      cb.addEventListener('change', () => { cb.checked ? state.ernsten.add(e) : state.ernsten.delete(e); herteken(); });
      rij.append(el('label', {}, cb, e));
    });
    paneel.append(rij);

    paneel.append(el('h2', { text: 'Beoordeling' }));
    const sel = el('select', { id: 'f-status', 'aria-label': 'Filter op beoordeling' });
    [['alle', 'Alle meldingen'], ['onbeoordeeld', STATUS_TEKST.onbeoordeeld], ['terecht', STATUS_TEKST.terecht],
     ['onterecht', STATUS_TEKST.onterecht], ['onzeker', STATUS_TEKST.onzeker]].forEach(([v, t]) => sel.append(el('option', { value: v, selected: state.status === v }, t)));
    sel.addEventListener('change', () => { state.status = sel.value; herteken(); });
    paneel.append(sel);

    paneel.append(el('h2', { text: 'Zoeken' }));
    const zoek = el('input', { type: 'search', id: 'f-zoek', placeholder: 'ID, lokaal_id of tekst', value: state.zoek });
    zoek.addEventListener('input', () => { state.zoek = zoek.value.trim().toLowerCase(); herteken({ filtersBehouden: true }); });
    paneel.append(zoek);

    paneel.append(el('h2', { text: 'Voortgang' }));
    paneel.append(el('div', { id: 'voortgangtekst' }));
    paneel.append(el('div', { class: 'voortgang', 'aria-hidden': 'true' }, el('span', { id: 'voortgangbalk' })));
    werkVoortgangBij(feats);
    paneel.append(el('div', { class: 'nav' },
      el('button', { class: 'knop', type: 'button', onclick: () => map.fitBounds(L.geoJSON({ type: 'FeatureCollection', features: alle }).getBounds(), { padding: [30, 30] }) }, 'Zoom naar alles'),
      el('button', { class: 'knop', type: 'button', onclick: zoomNaarZichtbaar }, 'Zoom naar zichtbaar'),
      el('button', { class: 'knop', type: 'button', onclick: () => { resetFilters(); herteken({ vlakken: true }); } }, 'Filters wissen')));

    const over = el('details', { class: 'over' }, el('summary', { text: 'Over deze meldingen' }));
    const d = meta.drempels || {};
    over.append(
      el('p', { class: 'klein', text: meta.let_op || '' }),
      el('p', { class: 'klein', text: `Drempels: klein vlak < ${d.klein_vlak_m2} m², overlap > ${d.overlap_m2} m².` }),
      el('p', { class: 'klein', text: 'Beoordelingen worden alleen in deze browser bewaard. Exporteer ze (onderaan) om ze te delen of als testset te gebruiken. Houd voorbeelden voor het kiezen van drempels gescheiden van locaties voor de eindtoets.' }));
    paneel.append(over);
    if (actief && $(actief)) $(actief).focus();
  }

  function werkVoortgangBij(feats) {
    const beoordeeld = alle.filter((f) => statusVan(f.properties.id) !== 'onbeoordeeld').length;
    const tekst = $('voortgangtekst'), balk = $('voortgangbalk');
    if (tekst) tekst.textContent = `${feats.length} van ${alle.length} meldingen zichtbaar. ${beoordeeld} van ${alle.length} beoordeeld.`;
    if (balk) balk.style.width = (alle.length ? (100 * beoordeeld / alle.length) : 0) + '%';
  }

  // opties.zoom: pas het kaartbeeld aan. opties.filtersBehouden: laat het filterpaneel staan
  // (nodig tijdens typen in het zoekveld, anders raakt de cursor kwijt).
  function herteken(opties) {
    const feats = gefilterd();
    if (opties && opties.vlakken) tekenVlakken();
    tekenKaart(feats);
    tekenLijst(feats);
    if (opties && opties.filtersBehouden) werkVoortgangBij(feats); else tekenFilters(feats);
    if (opties && opties.zoom) zoomNaarZichtbaar();
  }

  function resetFilters() {
    state.types = new Set(Object.keys(typeInfo));
    state.ernsten = new Set(alle.map((f) => f.properties.ernst));
    state.status = 'alle';
    state.zoek = '';
    lagenState.vlakken = true;
    lagenState.meldingen = true;
    lagenState.klassen = new Set(vlakkenMeta.klassen || []);
  }

  // ---------- Tabs ----------
  function toonTab(naam) {
    ['filters', 'lijst', 'melding'].forEach((n) => {
      $('tab-' + n).setAttribute('aria-selected', String(n === naam));
      $('paneel-' + n).hidden = n !== naam;
    });
    document.querySelector('.panelen').scrollTop = 0;
  }
  ['filters', 'lijst', 'melding'].forEach((n) => $('tab-' + n).addEventListener('click', () => toonTab(n)));

  // ---------- Selectie en beoordelen ----------
  function kies(id, opties) {
    if (!perId.has(id)) return;
    geselecteerd = id;
    tekenDetail();
    toonTab('melding');
    markeerSelectie();
    document.querySelectorAll('ul.lijst li').forEach((li) => li.classList.toggle('actief', li.dataset.id === id));
    if (opties && opties.zoom) {
      const b = L.geoJSON(perId.get(id)).getBounds();
      map.fitBounds(b, { padding: [60, 60], maxZoom: 20 });
      // Op een telefoon staat de kaart boven de lijst: scroll er naartoe
      if (window.matchMedia('(max-width: 820px)').matches) $('kaart').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  function buur(richting, alleenOnbeoordeeld) {
    const lijst = alleenOnbeoordeeld ? alle.filter((f) => zichtbaar(f, true)) : gefilterd();
    if (!lijst.length) return null;
    let i = lijst.findIndex((f) => f.properties.id === geselecteerd);
    if (i === -1) i = richting > 0 ? -1 : 0;   // selectie zit niet in de lijst: begin aan het begin of einde
    for (let stap = 1; stap <= lijst.length; stap++) {
      const f = lijst[(((i + richting * stap) % lijst.length) + lijst.length) % lijst.length];
      if (f.properties.id === geselecteerd && lijst.length > 1) continue;
      if (!alleenOnbeoordeeld || statusVan(f.properties.id) === 'onbeoordeeld') return f.properties.id;
    }
    return null;
  }

  function zet(id, wijziging) {
    const huidig = beoordelingen[id] || {};
    const nieuw = Object.assign({}, huidig, wijziging, { tijd: new Date().toISOString(), door: opslag.lees(NAAM_KEY) || '' });
    if (!nieuw.status) { delete beoordelingen[id]; } else { beoordelingen[id] = nieuw; }
    bewaar();
  }

  function tekenDetail() {
    const paneel = $('paneel-melding');
    paneel.replaceChildren();
    const f = geselecteerd && perId.get(geselecteerd);
    if (!f) {
      paneel.append(el('p', { text: 'Klik op een vlak op de kaart of kies een melding in de lijst.' }));
      return;
    }
    const p = f.properties, info = typeInfo[p.type] || { label: p.type, uitleg: '' };
    const b = beoordelingen[p.id] || {};
    paneel.append(
      el('h2', { text: p.id }),
      el('div', {}, el('strong', { text: info.label }), ' ', el('span', { class: 'badge ' + p.ernst, text: p.ernst })),
      el('p', { class: 'klein', text: info.uitleg || '' }),
      el('dl', { class: 'kenmerken' },
        el('dt', { text: 'Toelichting' }), el('dd', { text: p.toelichting || '-' }),
        el('dt', { text: 'lokaal_id' }), el('dd', { text: p.lokaal_id || '-' }),
        el('dt', { text: 'Bronhouder' }), el('dd', { text: p.bronhouder || '-' }),
        el('dt', { text: 'fysiek_voorkomen' }), el('dd', { text: p.fysiek_voorkomen || '-' }),
        el('dt', { text: 'plus_fysiek_voorkomen' }), el('dd', { text: p.plus_fysiek_voorkomen || '-' }),
        el('dt', { text: 'Registratiejaar' }), el('dd', { text: p.registratiejaar != null ? String(p.registratiejaar) : '-' }),
        el('dt', { text: 'Oppervlakte' }), el('dd', { text: fmtM2(p.oppervlakte_m2) })));

    paneel.append(el('h2', { text: 'Jouw beoordeling' }));
    const knoppen = el('div', { class: 'statusknoppen', role: 'group', 'aria-label': 'Beoordeling' });
    ['terecht', 'onterecht', 'onzeker'].forEach((s) => {
      knoppen.append(el('button', {
        type: 'button', 'data-s': s, 'aria-pressed': String(b.status === s),
        onclick: () => { zet(p.id, { status: b.status === s ? null : s }); herteken(); tekenDetail(); },
      }, STATUS_GLYPH[s] + ' ' + STATUS_TEKST[s].replace(' signaal', '')));
    });
    paneel.append(knoppen);

    const gebruik = el('select', { id: 'gebruik' },
      el('option', { value: '' }, '(nog niet gekozen)'),
      el('option', { value: 'voorbeeld', selected: b.gebruik === 'voorbeeld' }, 'Voorbeeld: om drempels te kiezen'),
      el('option', { value: 'toets', selected: b.gebruik === 'toets' }, 'Toets: voor de eindbeoordeling'));
    gebruik.addEventListener('change', () => { if (b.status) { zet(p.id, { gebruik: gebruik.value }); } else { bericht('Kies eerst een beoordeling.'); gebruik.value = ''; } });
    paneel.append(el('label', { class: 'veld' }, 'Gebruik in de analyse', gebruik));

    const notitie = el('textarea', { id: 'notitie', placeholder: 'Bijvoorbeeld: wat zie je op de luchtfoto?' });
    notitie.value = b.notitie || '';
    notitie.addEventListener('change', () => { if (b.status) { zet(p.id, { notitie: notitie.value }); bericht('Notitie bewaard.'); } else { bericht('Kies eerst een beoordeling om een notitie te bewaren.'); } });
    paneel.append(el('label', { class: 'veld' }, 'Notitie', notitie));

    const naam = el('input', { type: 'text', id: 'beoordelaar', placeholder: 'Initialen', maxlength: 20, value: opslag.lees(NAAM_KEY) || '' });
    naam.addEventListener('change', () => { opslag.schrijf(NAAM_KEY, naam.value.trim()); });
    paneel.append(el('label', { class: 'veld' }, 'Beoordelaar', naam));

    paneel.append(el('div', { class: 'nav' },
      el('button', { class: 'knop', type: 'button', onclick: () => { const i = buur(-1, false); if (i) kies(i, { zoom: true }); } }, '← Vorige'),
      el('button', { class: 'knop', type: 'button', onclick: () => { const i = buur(1, false); if (i) kies(i, { zoom: true }); } }, 'Volgende →'),
      el('button', { class: 'knop primair', type: 'button', onclick: () => { const i = buur(1, true); if (i) kies(i, { zoom: true }); else bericht('Geen onbeoordeelde meldingen meer voor deze filters.'); } }, 'Volgende onbeoordeelde'),
      el('button', { class: 'knop', type: 'button', onclick: () => map.fitBounds(L.geoJSON(f).getBounds(), { padding: [60, 60], maxZoom: 20 }) }, 'Zoom naar vlak')));
  }

  // ---------- Export en import ----------
  const records = () => Object.entries(beoordelingen).map(([id, b]) => {
    const f = perId.get(id), p = f ? f.properties : {};
    return { id, lokaal_id: p.lokaal_id || null, type: p.type || null, status: b.status, gebruik: b.gebruik || '', notitie: b.notitie || '', door: b.door || '', tijd: b.tijd || '' };
  }).sort((a, c) => a.id.localeCompare(c.id));

  function download(naam, tekst, type) {
    const url = URL.createObjectURL(new Blob([tekst], { type }));
    const a = el('a', { href: url, download: naam });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  const stempel = () => new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');

  $('exp-json').addEventListener('click', () => {
    const r = records();
    if (!r.length) { bericht('Er zijn nog geen beoordelingen om te exporteren.'); return; }
    download(`beoordelingen-${stempel()}.json`, JSON.stringify({
      bron: { bronbestand: meta.bronbestand, sha256_bronbestand: meta.sha256_bronbestand, gegenereerd_utc: meta.gegenereerd_utc },
      geexporteerd_utc: new Date().toISOString(), beoordelingen: r,
    }, null, 2), 'application/json');
    bericht(`${r.length} beoordelingen geëxporteerd.`);
  });
  $('exp-csv').addEventListener('click', () => {
    const r = records();
    if (!r.length) { bericht('Er zijn nog geen beoordelingen om te exporteren.'); return; }
    const kol = ['id', 'lokaal_id', 'type', 'status', 'gebruik', 'door', 'tijd', 'notitie'];
    const cel = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    download(`beoordelingen-${stempel()}.csv`, '﻿' + [kol.join(';')].concat(r.map((x) => kol.map((k) => cel(x[k])).join(';'))).join('\r\n'), 'text/csv;charset=utf-8');
    bericht(`${r.length} beoordelingen geëxporteerd.`);
  });
  $('imp').addEventListener('click', () => $('imp-bestand').click());
  $('imp-bestand').addEventListener('change', async (e) => {
    const bestand = e.target.files[0];
    e.target.value = '';
    if (!bestand) return;
    try {
      const inhoud = JSON.parse(await bestand.text());
      if (!inhoud.bron || !Array.isArray(inhoud.beoordelingen)) throw new Error('Geen geldig beoordelingenbestand.');
      if (inhoud.bron.sha256_bronbestand !== meta.sha256_bronbestand) throw new Error('Dit bestand hoort bij een andere werkset; de meldings-ID\'s komen niet overeen.');
      let nieuw = 0, bijgewerkt = 0;
      inhoud.beoordelingen.forEach((r) => {
        if (!perId.has(r.id) || !['terecht', 'onterecht', 'onzeker'].includes(r.status)) return;
        const bestaand = beoordelingen[r.id];
        if (!bestaand) nieuw++;
        else if ((r.tijd || '') > (bestaand.tijd || '')) bijgewerkt++;
        else return;
        beoordelingen[r.id] = { status: r.status, gebruik: r.gebruik || '', notitie: r.notitie || '', door: r.door || '', tijd: r.tijd || '' };
      });
      bewaar(); herteken(); tekenDetail();
      bericht(`Geïmporteerd: ${nieuw} nieuw, ${bijgewerkt} bijgewerkt.`);
    } catch (err) { bericht('Importeren mislukt: ' + err.message); }
  });

  // ---------- Opstarten ----------
  function start(json, vlakken) {
    data = json; meta = json.metadata || {};
    // BGT-vlakken zijn optioneel: zonder bgt_vlakken.geojson werkt het dashboard met alleen meldingen
    vlakkenData = vlakken && Array.isArray(vlakken.features) ? vlakken : null;
    vlakkenMeta = vlakkenData ? (vlakkenData.metadata || {}) : {};
    if (vlakkenData && !vlakkenMeta.klassen) {
      vlakkenMeta.klassen = [...new Set(vlakkenData.features.map((f) => f.properties.klasse))];
      vlakkenMeta.aantal_per_klasse = {};
      vlakkenData.features.forEach((f) => { const k = f.properties.klasse; vlakkenMeta.aantal_per_klasse[k] = (vlakkenMeta.aantal_per_klasse[k] || 0) + 1; });
    }
    alle = json.features.slice();
    const volgorde = Object.keys(meta.typen || {});
    // Soorten uit de metadata, aangevuld met soorten die alleen in de data voorkomen
    typeInfo = {};
    volgorde.forEach((t) => { typeInfo[t] = meta.typen[t]; });
    alle.forEach((f) => { const t = f.properties.type; if (!typeInfo[t]) typeInfo[t] = { label: t.replace(/_/g, ' '), ernst: f.properties.ernst, uitleg: '' }; });
    Object.keys(typeInfo).forEach((t, i) => { typeKleur[t] = PALET[i % PALET.length]; });
    const typeVolgorde = Object.keys(typeInfo);
    alle.sort((a, b) => (ERNST[a.properties.ernst] ?? 9) - (ERNST[b.properties.ernst] ?? 9)
      || typeVolgorde.indexOf(a.properties.type) - typeVolgorde.indexOf(b.properties.type)
      || a.properties.id.localeCompare(b.properties.id));
    alle.forEach((f) => perId.set(f.properties.id, f));
    resetFilters();

    const gen = meta.gegenereerd_utc ? new Date(meta.gegenereerd_utc).toLocaleString('nl-NL') : '';
    $('bronregel').textContent = `${alle.length} meldingen uit ${meta.aantal_objecten != null ? meta.aantal_objecten : '?'} objecten (${meta.bronbestand || 'onbekende bron'})${gen ? ', gegenereerd ' + gen : ''}`;
    $('letop').textContent = meta.let_op || 'Een melding is een signaal en geen vastgestelde fout.';
    herteken({ zoom: true, vlakken: true });
    tekenDetail();
    if (!vlakkenData) bericht(`${VLAKKEN_URL} niet gevonden: alleen de meldingen worden getoond. Draai maak_meldingen.py opnieuw.`);
  }

  const haal = (url) => fetch(url).then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  Promise.all([haal(DATA_URL), haal(VLAKKEN_URL).catch(() => null)]).then(([m, v]) => start(m, v)).catch((err) => {
    $('bronregel').textContent = 'De meldingen konden niet worden geladen.';
    $('paneel-filters').replaceChildren(
      el('p', { text: `${DATA_URL} kon niet worden gelezen (${err.message}).` }),
      el('p', { text: 'Een pagina die een bestand ophaalt werkt niet door hem dubbel te klikken. Start in deze map een lokale server:' }),
      el('pre', { text: 'python -m http.server 8000' }),
      el('p', { text: 'en open daarna http://localhost:8000 in je browser.' }));
  });
}());
</script>
</body>
</html>
